apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-mcp
  namespace: trade-mcp
  labels:
    app: trade-mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trade-mcp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: trade-mcp
    spec:
      nodeSelector:
        workload: apps
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-registry-secret
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: trade-mcp
                topologyKey: kubernetes.io/hostname
      containers:
        - name: trade-mcp
          image: ghcr.io/yugalinks/yugalinks-trade-mcp:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
          envFrom:
            - configMapRef:
                name: trade-mcp-config
            - secretRef:
                name: trade-mcp-env
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 18
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
